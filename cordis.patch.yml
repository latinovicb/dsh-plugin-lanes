# dsh-plugin-lanes bundle patch.
#
# This bundle owns the Subagent Director rows and the lanes preset. Do not also
# select the dsh-plugin-subagent-director bundle in the same profile: that would
# insert the same two rows again.
#
# The package depends on dsh-plugin-subagent-director; its provider routes and
# subagent-model-selection allowlist must be configured by the profile.
#
# The lanes preset is generated from the shipped standard preset for DSH
# 0.2.2-rc.1 because a later patch layer cannot disable nested preset rows.
# Refresh it with ./gen-lanes-preset.py --target cordis.patch.yml after a DSH
# upgrade, review the diff, then reinstall/restart.

- insert:
    - id: subagent-director
      name: dsh-plugin-subagent-director
      config:
        backgroundMode: continuable
        defaultProvider: opencode-go
        defaultModel: deepseek-v4.1-flash
        defaultReasoningEffort: max
        defaultRole: implementer
        roles:
          planner:
            displayName: planner
            description: senior planning consultant on a stronger model - consulted for
              ambiguous intent, architecture and cross-cutting design decisions,
              plan or review requests, risky or irreversible choices, and before a
              second retry of a failed approach; returns a decision-complete
              recommendation with rationale and never executes
            provider: opencode-go
            model: glm-5.3
            reasoningEffort: max
          verifier:
            displayName: verifier
            description: independent verification of finished work - receives the request,
              acceptance criteria and the actual artifact or diff, hunts for bugs, missed
              requirements, regressions and unstated assumptions, runs the relevant checks,
              and returns PASS/FAIL with evidence, path:line findings and severity; never
              edits files
            provider: opencode-go
            model: glm-5.3
            reasoningEffort: max
          implementer:
            displayName: implementer
            description: performs well-specified code changes, edits, and file transforms in
              any language; expects exact specs with paths, constraints, and
              acceptance checks; delegate every concrete edit, script, or build task
              here
          researcher:
            displayName: researcher
            description: explores code, docs, state, and workspaces and returns concise
              evidence-backed summaries with file paths and line references;
              delegate all reading, investigation, and what-is-X questions here
          test-runner:
            displayName: test-runner
            description: runs commands, test suites, and verification procedures, triages
              failures, and reports exact outputs and exit codes; delegate command
              execution and checking here
          asset-renderer:
            displayName: asset-renderer
            description: renders and iterates on image, video, or audio assets from a spec
              (PIL, ffmpeg, project render pipelines), self-verifies output, and
              returns artifact paths plus a verification note; delegate whole
              render-verify loops here
          app-operator:
            displayName: app-operator
            description: drives a live application or service through its control channel or
              MCP (DaVinci, Blender, Reaper sessions) - inspecting state, applying
              changes, saving, verifying, and reporting exact responses; delegate
              stateful app work here
    - id: subagent-director-bridge
      name: dsh-plugin-subagent-director/bridge

- id: agent-preset-registry
  config:
    default: lanes

# lanes preset (generated by gen-lanes-preset.py from DSH 0.2.2-rc.1)
# `standard` minus `tool-subagent`, `tool-subagent-fork`, `workflow-ptc`, `tool-workflow`; delegation goes only through role lanes.
# Do not edit: refresh with `./gen-lanes-preset.py --target cordis.patch.yml`
- insert:
    - id: preset-lanes
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lanes
        name: lanes
        description: standard minus the built-in delegation tools; role lanes only
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          - id: lanes-policy
            name: dsh-plugin-lanes
